[project]
name = "truthlens-backend"
version = "0.1.0"
description = "FastAPI backend for the TruthLens multi-agent forensic system."
requires-python = ">=3.10"

dependencies = [
  # Web layer (Phase 1)
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",

  # Forensics + ML (shared with legacy AIDE repo)
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "Pillow>=9.5",
  "torch>=2.0",
  "torchvision>=0.15",
  "shap>=0.43",
  "matplotlib>=3.7",

  # Gemini
  "google-genai>=0.2",
  "google-cloud-aiplatform>=1.60",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
